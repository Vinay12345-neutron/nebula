# Experiment 05B: Detailed CXLMemSim Memory-System Validation
experiment:
  id: "EXP-05B"
  name: "cxlmemsim_validation"
  description: "Detailed CXLMemSim memory-system validation of TierMoE-Batch-Aware-Greedy vs. Baseline-3-Single-Request across 10 controlled conditions on authentic Qwen3-30B-A3B ShareGPT routing traces."
  phase: "Phase 9 (EXP-05B)"

workload:
  dataset: "authentic_model_traces"
  trace_file: "data/traces/qwen3_sharegpt_trace.parquet"
  batch_sizes: [8, 16, 32]

model:
  name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  num_experts: 128
  top_k: 8
  num_layers: 48
  expert_size_bytes: 268435456  # Exactly 256 MiB per expert = 4,194,304 lines (64B each)

memory:
  # Fast-tier capacity ratio (capacity-constrained: 25% of 128 experts = 32 experts)
  fast_memory_ratios: [0.25]
  fast_capacity_experts: 32

cxl_simulation:
  baseline_bandwidth_gbps: 32.0
  baseline_latency_ns: 300.0
  sensitivity_bandwidths_gbps: [16.0, 64.0]
  dram_latency_ns: 110.0

algorithms:
  - "baseline_3_single_request"
  - "tiermoe_batch_aware_greedy"

# Exactly 10 experimental evaluation conditions:
# Core conditions (B in [8, 16, 32] at baseline 32 GB/s, 300 ns): 6 conditions
# Bandwidth sensitivity (B=32 at 16 and 64 GB/s, 300 ns): 4 conditions
evaluation_conditions:
  - {batch_size: 8,  bandwidth_gbps: 32.0, latency_ns: 300.0, is_core: true}
  - {batch_size: 16, bandwidth_gbps: 32.0, latency_ns: 300.0, is_core: true}
  - {batch_size: 32, bandwidth_gbps: 32.0, latency_ns: 300.0, is_core: true}
  - {batch_size: 32, bandwidth_gbps: 16.0, latency_ns: 300.0, is_core: false}
  - {batch_size: 32, bandwidth_gbps: 64.0, latency_ns: 300.0, is_core: false}

outputs:
  results_dir: "results/exp05b_rq4_cxlmemsim_validation"
  figures_dir: "figures"
